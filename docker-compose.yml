services:
  db:
    image: postgres:16-alpine
    container_name: cafenet-db
    environment:
      POSTGRES_DB: cafenet
      POSTGRES_USER: cafenet
      POSTGRES_PASSWORD: cafenet
    ports:
      - "5434:5432"
    volumes:
      - cafenet_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cafenet -d cafenet" ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: cafenet-api
    environment:
      APP_PORT: 8090
      DB_URL: jdbc:postgresql://db:5432/cafenet
      DB_USER: cafenet
      DB_PASSWORD: cafenet
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8090/api/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:5
    container_name: cafenet-adminer
    ports:
      - "8091:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cafenet_db:
